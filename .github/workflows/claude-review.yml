name: Claude PR Review

on:
    pull_request:
        types: [opened, synchronize, reopened]

permissions:
    contents: read
    pull-requests: write
    issues: write
    id-token: write

jobs:
    review:
        permissions:
            contents: read
            pull-requests: write
            issues: write
            id-token: write

        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Claude review
              uses: anthropics/claude-code-action@v1
              with:
                  anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
                  prompt: |
                      Review this pull request for concrete bugs,
                      security issues, regressions and incorrect Symfony
                      or Doctrine usage.
