name: Claude PR Review

on:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened

# Permissions nécessaires :
# - contents: lire le dépôt et pousser les corrections de Claude sur la branche de la PR
# - pull-requests: lire la PR et publier des commentaires
# - issues: publier certains commentaires liés à la PR
# - id-token: obtenir le token OIDC utilisé par l'action Claude
permissions:
    contents: write
    pull-requests: write
    issues: write
    id-token: write

concurrency:
    group: claude-review-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    review:
        name: Review with Claude
        runs-on: ubuntu-latest

        # - Ignore les PR venant de forks (pas d'accès aux secrets ni en écriture).
        # - Ignore les pushs faits par Claude lui-même pour éviter une boucle de revues.
        if: >-
            github.event.pull_request.head.repo.full_name == github.repository
            && github.actor != 'claude[bot]'

        # Ces permissions peuvent aussi être définies au niveau du job.
        permissions:
            contents: write
            pull-requests: write
            issues: write
            id-token: write

        # Base MariaDB pour que Claude puisse lancer migrations, fixtures et tests.
        services:
            database:
                image: mariadb:10.11
                env:
                    MARIADB_DATABASE: app
                    MARIADB_USER: app
                    MARIADB_PASSWORD: '!ChangeMe!'
                    MARIADB_ROOT_PASSWORD: '!ChangeMe!'
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="healthcheck.sh --connect --innodb_initialized"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=10

        env:
            APP_ENV: test
            DATABASE_URL: 'mysql://root:!ChangeMe!@127.0.0.1:3306/app?serverVersion=10.11.2-MariaDB&charset=utf8mb4'

        steps:
            # On se place sur la branche de la PR (et non sur le commit de merge)
            # pour que Claude puisse y pousser ses corrections.
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.head_ref }}
                  fetch-depth: 0

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: ctype, iconv, intl, pdo_mysql
                  tools: composer:v2
                  coverage: none

            - name: Install dependencies
              run: composer install --no-interaction --no-progress --prefer-dist

            - name: Prepare test database
              run: |
                  php bin/console doctrine:database:create --if-not-exists
                  php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration

            - name: Review pull request with Claude
              uses: anthropics/claude-code-action@v1
              with:
                  # Jeton OAuth de l'abonnement Claude (généré via `claude setup-token`).
                  claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

                  # Outils autorisés : lecture/édition de fichiers, commandes Symfony/PHPUnit
                  # pour vérifier, et commandes git pour committer et pousser sur la PR.
                  claude_args: |
                      --allowedTools "Read,Edit,Write,Glob,Grep,Bash(vendor/bin/phpunit:*),Bash(php bin/console:*),Bash(php -l:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"

                  prompt: |
                      REPO: ${{ github.repository }}
                      PR NUMBER: ${{ github.event.pull_request.number }}
                      BRANCH: ${{ github.head_ref }}

                      Review this pull request for the Symfony project.

                      Analyze the changes in the context of the whole repository.

                      Look only for concrete and actionable issues related to:
                      - bugs and logic errors;
                      - security vulnerabilities;
                      - regressions;
                      - incorrect Symfony usage;
                      - incorrect Doctrine ORM usage;
                      - invalid validation or authorization;
                      - database migration risks;
                      - missing tests for critical behavior.

                      Ignore:
                      - formatting preferences;
                      - minor naming preferences;
                      - purely subjective refactoring suggestions;
                      - issues unrelated to the changed code.

                      Fixing issues:
                      - Fix directly every issue whose correction is clear, local and low risk.
                      - Never modify existing migration files that may already have been
                        executed; never touch .github/, .env*, secrets or composer.lock.
                      - PHP 8.4, Composer dependencies and a MariaDB test database (migrated)
                        are available. After your fixes and before committing, verify with:
                        `php bin/console lint:container`, `php bin/console doctrine:schema:validate`,
                        `php bin/console doctrine:fixtures:load --no-interaction` and
                        `vendor/bin/phpunit` (if tests exist). If a check fails because of your
                        changes, fix it or revert them; never push code that breaks these checks.
                      - Group your fixes in a single commit on branch ${{ github.head_ref }},
                        with a message starting with "fix(review):" describing the changes,
                        then push it to origin.
                      - For issues you did not fix (risky, ambiguous or requiring a design
                        decision), leave an inline comment on the relevant line explaining
                        the problem, its impact and a precise correction.

                      Finally, post a summary comment on the PR (in French) with `gh pr comment`:
                      - the list of fixes you committed (file, line, why), or "Aucune correction";
                      - the list of remaining issues left as inline comments;
                      - the checks you ran and their result;
                      - a clear verdict: "✅ PR prête à merger" or "⚠️ À corriger avant merge".