name: Claude PR Review

on:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened

# Permissions nécessaires :
# - contents: lire le dépôt (Claude ne pousse rien, il propose des suggestions)
# - pull-requests: lire la PR et publier des commentaires
# - issues: publier certains commentaires liés à la PR
# - id-token: obtenir le token OIDC utilisé par l'action Claude
permissions:
    contents: read
    pull-requests: write
    issues: write
    id-token: write

concurrency:
    group: claude-review-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    review:
        name: Review with Claude
        runs-on: ubuntu-latest

        # Ignore les PR venant de forks (pas d'accès aux secrets).
        if: github.event.pull_request.head.repo.full_name == github.repository

        # Ces permissions peuvent aussi être définies au niveau du job.
        permissions:
            contents: read
            pull-requests: write
            issues: write
            id-token: write

        # Base MariaDB pour que Claude puisse lancer migrations, fixtures et tests.
        services:
            database:
                image: mariadb:10.11
                env:
                    MARIADB_DATABASE: app
                    MARIADB_USER: app
                    MARIADB_PASSWORD: '!ChangeMe!'
                    MARIADB_ROOT_PASSWORD: '!ChangeMe!'
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="healthcheck.sh --connect --innodb_initialized"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=10

        env:
            APP_ENV: test
            DATABASE_URL: 'mysql://root:!ChangeMe!@127.0.0.1:3306/app?serverVersion=10.11.2-MariaDB&charset=utf8mb4'
            # Fichier où Claude écrit son verdict, lu par l'étape « Enforce Claude verdict ».
            VERDICT_FILE: claude-verdict.txt

        steps:
            # On se place sur le dernier commit de la PR pour que les numéros de ligne
            # des suggestions correspondent au code de la PR.
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.head.sha }}
                  fetch-depth: 0

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: ctype, iconv, intl, pdo_mysql
                  tools: composer:v2
                  coverage: none

            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: ~/.cache/composer
                  key: composer-${{ hashFiles('composer.lock') }}
                  restore-keys: composer-

            - name: Install dependencies
              run: composer install --no-interaction --no-progress --prefer-dist

            - name: Prepare test database
              run: |
                  php bin/console doctrine:database:create --if-not-exists
                  php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration

            - name: Review pull request with Claude
              uses: anthropics/claude-code-action@v1
              with:
                  # Jeton OAuth de l'abonnement Claude (généré via `claude setup-token`).
                  claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

                  # Outils autorisés : lecture du code, édition locale pour tester une correction
                  # (jamais committée : aucune commande git d'écriture n'est autorisée),
                  # commandes Symfony/PHPUnit pour vérifier, et commentaires sur la PR.
                  claude_args: |
                      --allowedTools "Read,Edit,Write,Glob,Grep,Bash(vendor/bin/phpunit:*),Bash(php bin/console:*),Bash(php -l:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git checkout:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"

                  prompt: |
                      REPO: ${{ github.repository }}
                      PR NUMBER: ${{ github.event.pull_request.number }}

                      Review this pull request for the Symfony project.

                      Analyze the changes in the context of the whole repository.

                      Look only for concrete and actionable issues related to:
                      - bugs and logic errors;
                      - security vulnerabilities;
                      - regressions;
                      - incorrect Symfony usage;
                      - incorrect Doctrine ORM usage;
                      - invalid validation or authorization;
                      - database migration risks;
                      - missing tests for critical behavior.

                      Ignore:
                      - formatting preferences;
                      - minor naming preferences;
                      - purely subjective refactoring suggestions;
                      - issues unrelated to the changed code.

                      You must NOT commit or push anything. The PR author accepts each fix manually.

                      For every issue, leave an inline comment on the relevant line (in French)
                      explaining the problem and its impact:
                      - When the fix is local to the commented lines, include it as a GitHub
                        suggestion block (```suggestion ... ```) replacing exactly those lines,
                        so the author can apply it with "Commit suggestion".
                      - Otherwise, describe the precise correction to make.
                      - Never suggest changes to existing migration files that may already have
                        been executed, nor to .github/, .env*, secrets or composer.lock.

                      PHP 8.4, Composer dependencies and a migrated MariaDB test database are
                      available. Run `php bin/console lint:container`,
                      `php bin/console doctrine:schema:validate`,
                      `php bin/console doctrine:fixtures:load --no-interaction` and
                      `vendor/bin/phpunit` (if tests exist). You may apply a fix locally to check
                      that it works, but restore the files afterwards with `git checkout -- <file>`.

                      Then post a summary comment on the PR (in French) with `gh pr comment`:
                      - the list of issues found (file, line, why), or "Aucun problème";
                      - the checks you ran and their result;
                      - a clear verdict: "✅ PR prête à merger" or "⚠️ À corriger avant merge".

                      Finally, write the verdict to the file `claude-verdict.txt` at the repository
                      root, containing exactly one word:
                      - APPROVED if no issue remains;
                      - CHANGES_REQUESTED if at least one issue must be fixed before merging.
                      This file is read by the next CI step: CHANGES_REQUESTED fails the check
                      and blocks the merge.

            # Rend la revue bloquante : le check échoue si Claude demande des corrections
            # ou n'a pas rendu de verdict.
            # Exception : si la PR modifie ce workflow, l'action Claude refuse de tourner
            # (sécurité) ; le check passe alors avec un avertissement et la PR doit être
            # relue manuellement.
            - name: Enforce Claude verdict
              env:
                  BASE_REF: ${{ github.base_ref }}
              run: |
                  if ! git diff --quiet "origin/${BASE_REF}" -- .github/workflows/claude-review.yml; then
                      echo "::warning::Cette PR modifie le workflow de review : Claude ne l'a pas relue, relecture manuelle requise."
                      exit 0
                  fi
                  verdict="$(tr -d '[:space:]' < "$VERDICT_FILE" 2>/dev/null || true)"
                  case "$verdict" in
                      APPROVED)
                          echo "Claude a approuvé la PR."
                          ;;
                      CHANGES_REQUESTED)
                          echo "::error::Claude demande des corrections : voir les commentaires de la PR."
                          exit 1
                          ;;
                      *)
                          echo "::error::Aucun verdict valide rendu par Claude (valeur : '${verdict}')."
                          exit 1
                          ;;
                  esac
